name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # What this checks: the lockfile is in sync and the code typechecks and
      # builds. There are no automated tests in this repo yet, so behaviour is
      # NOT verified here.
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build
        run: pnpm run build
